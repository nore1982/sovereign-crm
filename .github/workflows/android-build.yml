name: 🤖 Sovereign CRM — Direct Gradle Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔨 Build with Gradle
        run: |
          # البحث عن المجلد الذي يحتوي على ملف build.gradle الخاص بالأندرويد والانتقال إليه
          BUILD_FILE=$(find . -name "build.gradle" -not -path "*/.*" | grep -E "android|app" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE=$(find . -name "build.gradle" -not -path "*/.*" | head -n 1)
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Building in directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # استخدام gradle العام مباشرة
          gradle assembleDebug --no-daemon

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SovereignCRM-APK
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 7