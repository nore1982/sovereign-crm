name: 🤖 Sovereign CRM — Clean Production Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🔍 Find Project and Grant Permission
      run: |
        echo "Searching for build files..."
        if [ -f "android/gradlew" ]; then
          chmod +x android/gradlew
          echo "Found gradlew inside android directory."
        elif [ -f "gradlew" ]; then
          chmod +x gradlew
          echo "Found gradlew in root directory."
        else
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
        fi

    - name: 🔨 Build APK with Gradle
      run: |
        if [ -d "android" ]; then
          cd android
          ./gradlew assembleDebug --no-daemon
        else
          ./gradlew assembleDebug --no-daemon
        fi

    - name: 📤 Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SovereignCRM-APK-Clean
        path: '**/build/outputs/apk/debug/*.apk'
        retention-days: 7