name: 🏛️ Sovereign CRM — Android Build (Fixed)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '11'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 🧪 Job 1: بناء Debug APK
  # ═══════════════════════════════════════════════════════════════
  build-debug:
    name: 🧪 Build Debug APK
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event.inputs.build_type == 'debug' || github.ref != 'refs/heads/main'

    steps:
      # ─────────── Checkout ───────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────── Setup Node.js ───────────
      - name: ⚡ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ─────────── Setup Java ───────────
      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      # ─────────── Cache Dependencies ───────────
      - name: 📦 Cache npm & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.gradle/caches
            ~/.gradle/wrapper
            node_modules
          key: ${{ runner.os }}-sovereign-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-sovereign-

      # ─────────── Install Dependencies ───────────
      - name: 📦 Install Dependencies
        run: |
          npm ci
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save
          npm install @capacitor/splash-screen @capacitor/status-bar @capacitor/keyboard @capacitor/push-notifications @capacitor/local-notifications --save

      # ─────────── Build Frontend ───────────
      - name: 🏗️ Build Production Frontend
        run: npm run build:prod
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://sovereign-crm-api.up.railway.app' }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL || 'https://sovereign-crm-api.up.railway.app' }}

      # ─────────── 🛠️ Fix: Generate Android Project Files ───────────
      - name: 🛠️ Generate Android Project Structure
        run: |
          echo "🔍 Checking Android project structure..."

          # إذا لم يكن مجلد android موجوداً، نُنشئه عبر Capacitor
          if [ ! -d "android" ]; then
            echo "⚠️  Android folder not found. Running 'npx cap add android'..."
            npx cap add android
          fi

          # مزامنة Capacitor
          echo "🔄 Running Capacitor sync..."
          npx cap sync android

          # ─── التأكد من وجود root build.gradle ───
          if [ ! -f "android/build.gradle" ]; then
            echo "⚠️  Root build.gradle missing. Creating..."
            cat > android/build.gradle << 'EOF'
          // Top-level build file for Sovereign CRM
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          fi

          # ─── التأكد من وجود settings.gradle ───
          if [ ! -f "android/settings.gradle" ]; then
            echo "⚠️  settings.gradle missing. Creating..."
            cat > android/settings.gradle << 'EOF'
          include ':app'
          include ':capacitor-android'
          project(':capacitor-android').projectDir = new File('./node_modules/@capacitor/android/capacitor')
          EOF
          fi

          # ─── التأكد من وجود gradle.properties ───
          if [ ! -f "android/gradle.properties" ]; then
            echo "⚠️  gradle.properties missing. Creating..."
            cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          fi

          # ─── التأكد من وجود Gradle Wrapper ───
          if [ ! -f "android/gradlew" ]; then
            echo "⚠️  Gradle Wrapper missing. Generating..."
            cd android
            # استخدام Gradle المثبت في الـ runner
            gradle wrapper --gradle-version 8.0.2 || ./gradlew wrapper --gradle-version 8.0.2 || true
            
            # إذا فشل، ننشئ الـ wrapper يدوياً
            if [ ! -f "gradlew" ]; then
              mkdir -p gradle/wrapper
              cat > gradle/wrapper/gradle-wrapper.properties << 'GRADLEEOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          GRADLEEOF
              
              # تحميل wrapper jar
              curl -L -o gradle/wrapper/gradle-wrapper.jar \
                https://raw.githubusercontent.com/gradle/gradle/v8.0.2/gradle/wrapper/gradle-wrapper.jar || true
              
              cat > gradlew << 'WRAPEOF'
          #!/bin/sh
          exec "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" "$@"
          WRAPEOF
              chmod +x gradlew
            fi
            cd ..
          fi

          # ─── التأكد من وجود variables.gradle ───
          if [ ! -f "android/variables.gradle" ]; then
            echo "⚠️  variables.gradle missing. Creating..."
            cat > android/variables.gradle << 'EOF'
          ext {
              minSdkVersion = 24
              compileSdkVersion = 33
              targetSdkVersion = 33
              androidxActivityVersion = '1.7.0'
              androidxAppCompatVersion = '1.6.1'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.10.0'
              androidxFragmentVersion = '1.5.6'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.6.1'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              cordovaAndroidVersion = '10.1.1'
          }
          EOF
          fi

          # ─── التأكد من إعدادات app/build.gradle ───
          echo "⚙️  Configuring app/build.gradle for API 33..."
          sed -i 's/compileSdk [0-9]*/compileSdk 33/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdk [0-9]*/targetSdk 33/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 33/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 33/g' android/app/build.gradle 2>/dev/null || true

          # ─── التأكد من وجود AndroidManifest.xml ───
          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "⚠️  AndroidManifest.xml missing. Creating..."
            mkdir -p android/app/src/main/res/xml
            cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.sovereign.crm">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="com.sovereign.crm.MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

          # ─── التأكد من وجود MainActivity.java ───
          mkdir -p android/app/src/main/java/com/sovereign/crm
          if [ ! -f "android/app/src/main/java/com/sovereign/crm/MainActivity.java" ]; then
            echo "⚠️  MainActivity.java missing. Creating..."
            cat > android/app/src/main/java/com/sovereign/crm/MainActivity.java << 'EOF'
          package com.sovereign.crm;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {}
          EOF
          fi

          echo "✅ Android project structure verified!"

      # ─────────── Make gradlew executable ───────────
      - name: 🔧 Make gradlew executable
        run: chmod +x android/gradlew

      # ─────────── Build Debug APK ───────────
      - name: 🔨 Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ─────────── Upload Debug Artifact ───────────
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SovereignCRM-Debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # ─────────── Summary ───────────
      - name: 📊 Build Summary
        run: |
          echo "✅ Debug APK built successfully!"
          ls -lh android/app/build/outputs/apk/debug/

  # ═══════════════════════════════════════════════════════════════
  # 🔐 Job 2: بناء Release APK موقّع
  # ═══════════════════════════════════════════════════════════════
  build-release:
    name: 🔐 Build Signed Release APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event.inputs.build_type == 'release'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: 📦 Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.gradle/caches
            ~/.gradle/wrapper
            node_modules
          key: ${{ runner.os }}-sovereign-release-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-sovereign-release-

      - name: 📦 Install Dependencies
        run: |
          npm ci
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save
          npm install @capacitor/splash-screen @capacitor/status-bar @capacitor/keyboard --save

      - name: 🏗️ Build Production Frontend
        run: npm run build:prod
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://sovereign-crm-api.up.railway.app' }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL || 'https://sovereign-crm-api.up.railway.app' }}

      # ─────────── 🛠️ Fix: Generate Android Project Files ───────────
      - name: 🛠️ Generate Android Project Structure
        run: |
          echo "🔍 Checking Android project structure..."

          if [ ! -d "android" ]; then
            echo "⚠️  Android folder not found. Running 'npx cap add android'..."
            npx cap add android
          fi

          echo "🔄 Running Capacitor sync..."
          npx cap sync android

