name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ultimate Gradle Setup and Build
        run: |
          echo "=== 1. Checking repository structure ==="
          ls -la

          # البحث عن ملف settings.gradle أو build.gradle الحقيقي في المستودع بالكامل
          SETTINGS_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | grep -v "\.git" | head -n 1)
          
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "Found Gradle project at: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          else
            echo "No Gradle settings file found. Searching for build.gradle..."
            BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | grep -v "\.git" | head -n 1)
            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
              echo "Found build.gradle at: $PROJECT_DIR"
              cd "$PROJECT_DIR"
            else
              echo "Error: This repository does not contain any Android Gradle project files!"
              exit 1
            fi
          fi

          echo "=== 2. Preparing Gradle Wrapper ==="
          if [ ! -f "gradlew" ]; then
            echo "Generating gradle wrapper..."
            gradle wrapper
          fi

          chmod +x gradlew

          echo "=== 3. Building APK ==="
          ./gradlew assembleDebug || ./gradlew build -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
        continue-on-error: true