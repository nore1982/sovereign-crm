name: 🤖 Sovereign CRM — Direct Gradle Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔨 Build APK using Gradle Direct
        run: |
          # البحث عن مكان ملف build.gradle وتنفيذ البناء مباشرة
          if [ -f "build.gradle" ]; then
            gradle assembleDebug --no-daemon
          elif [ -f "android/build.gradle" ]; then
            cd android
            gradle assembleDebug --no-daemon
          else
            echo "❌ لم يتم العثور على ملف البناء الرئيسي"
            exit 1
          fi

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SovereignCRM-APK
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 7