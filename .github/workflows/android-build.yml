name: 🏛️ Sovereign CRM — Android Build (Lock-Free)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.0.2'
  AGP_VERSION: '8.1.0'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 🧪 Job 1: بناء Debug APK
  # ═══════════════════════════════════════════════════════════════
  build-debug:
    name: 🧪 Build Debug APK
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event.inputs.build_type == 'debug' || github.ref != 'refs/heads/main'

    steps:
      # ─────────── Checkout ───────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────── Setup Node.js (بدون cache lock) ───────────
      - name: ⚡ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # ❌ تم إزالة cache: 'npm' لأنها تتطلب package-lock.json

      # ─────────── Setup JDK 17 ───────────
      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # ─────────── Setup Android SDK ───────────
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: true

      # ─────────── Cache Gradle Only (بدون npm lock) ───────────
      - name: 📦 Cache Gradle Only
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/app/build.gradle', 'android/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ─────────── Install npm Dependencies (npm install بدلاً من npm ci) ───────────
      - name: 📦 Install npm Dependencies
        run: |
          echo "🔧 Installing npm packages without lock file..."
          npm install
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 --save-exact
          npm install @capacitor/splash-screen @capacitor/status-bar @capacitor/keyboard --save

      # ─────────── Build Frontend ───────────
      - name: 🏗️ Build Production Frontend
        run: npm run build:prod
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://sovereign-crm-api.up.railway.app' }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL || 'https://sovereign-crm-api.up.railway.app' }}

      # ─────────── Generate Android via Capacitor ───────────
      - name: 📱 Generate Android Project via Capacitor
        run: |
          echo "🔄 Checking Android project..."

          if [ ! -d "android" ]; then
            echo "⚠️  Android folder missing. Generating via Capacitor..."
            npx cap add android
          fi

          echo "🔄 Syncing Capacitor Android..."
          npx cap sync android

          # Verify critical files
          [ -f "android/build.gradle" ] || (echo "❌ Missing root build.gradle" && exit 1)
          [ -f "android/settings.gradle" ] || (echo "❌ Missing settings.gradle" && exit 1)
          [ -f "android/gradlew" ] || (echo "❌ Missing gradlew" && exit 1)
          echo "✅ Android project verified"

      # ─────────── Fix Gradle Wrapper ───────────
      - name: ⚙️ Fix Gradle Wrapper Version
        run: |
          WRAPPER_PROPS="android/gradle/wrapper/gradle-wrapper.properties"
          mkdir -p android/gradle/wrapper
          cat > "$WRAPPER_PROPS" << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          echo "✅ Gradle wrapper fixed to 8.0.2"

      # ─────────── Fix AGP Version ───────────
      - name: ⚙️ Fix Android Gradle Plugin Version
        run: |
          sed -i 's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.1.0/g' android/build.gradle
          echo "✅ AGP fixed to 8.1.0"

      # ─────────── Configure API 33 ───────────
      - name: ⚙️ Configure app/build.gradle for API 33
        run: |
          sed -i 's/compileSdk [0-9]*/compileSdk 33/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdk [0-9]*/targetSdk 33/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 33/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 33/g' android/app/build.gradle 2>/dev/null || true
          echo "✅ API 33 configured"

      # ─────────── Fix variables.gradle ───────────
      - name: ⚙️ Fix variables.gradle
        run: |
          VARS_FILE="android/variables.gradle"
          if [ -f "$VARS_FILE" ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 33/g' "$VARS_FILE" 2>/dev/null || true
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 33/g' "$VARS_FILE" 2>/dev/null || true
            echo "✅ variables.gradle updated"
          fi

      # ─────────── Fix Permissions ───────────
      - name: 🔧 Fix gradlew Permissions
        run: chmod +x android/gradlew

      # ─────────── Build Debug APK ───────────
      - name: 🔨 Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ─────────── Upload Debug Artifact ───────────
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SovereignCRM-Debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # ─────────── Summary ───────────
      - name: 📊 Build Summary
        if: always()
        run: |
          echo "═══════════════════════════════════════════════════════"
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ SUCCESS: Debug APK built successfully!"
            ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ FAILED: APK not found"
            find android/app/build -type f 2>/dev/null || echo "No build outputs found"
          fi
          echo "═══════════════════════════════════════════════════════"

  # ═══════════════════════════════════════════════════════════════
  # 🔐 Job 2: بناء Release APK موقّع
  # ═══════════════════════════════════════════════════════════════
  build-release:
    name: 🔐 Build Signed Release APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event.inputs.build_type == 'release'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # ❌ تم إزالة cache: 'npm' — لا يتطلب package-lock.json

      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: true

      - name: 📦 Cache Gradle Only
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('android/app/build.gradle', 'android/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📦 Install npm Dependencies
        run: |
          echo "🔧 Installing npm packages without lock file..."
          npm install
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 --save-exact
          npm install @capacitor/splash-screen @capacitor/status-bar @capacitor/keyboard --save

      - name: 🏗️ Build Production Frontend
        run: npm run build:prod
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://sovereign-crm-api.up.railway.app' }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL || 'https://sovereign-crm-api.up.railway.app' }}

      - name: 📱 Generate Android Project via Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          [ -f "android/build.gradle" ] || (echo "❌ Missing root build.gradle" && exit 1)
          [ -f "android/settings.gradle" ] || (echo "❌ Missing settings.gradle" && exit 1)
          [ -f "android/gradlew" ] || (echo "❌ Missing gradlew" && exit 1)
          echo "✅ Android project verified"

      - name: ⚙️ Fix Gradle Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: ⚙️ Fix AGP Version
        run: sed -i 's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.1.0/g' android/build.gradle

      - name: ⚙️ Configure API 33
        run: |
          sed -i 's/compileSdk [0-9]*/compileSdk 33/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdk [0-9]*/targetSdk 33/g' android/app/build.gradle 2>/dev/null || true

      - name: 🔧 Fix Permissions
        run: chmod +x android/gradlew

      - name: 🔐 Setup Keystore
        run: |
          if [ -n "${{ secrets.SOVEREIGN_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SOVEREIGN_KEYSTORE_BASE64 }}" | base64 -d > sovereign-crm.keystore
            echo "✅ Keystore decoded"
          else
            echo "⚠️  Generating temporary keystore..."
            keytool -genkey -v -keystore sovereign-crm.keystore -alias sovereign -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Sovereign,OU=Dev,O=Sovereign,L=Riyadh,C=SA" -storepass "sovereign2026" -keypass "sovereign2026"
          fi

      - name: 🔨 Build Signed Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          SOVEREIGN_KEYSTORE_PASSWORD: ${{ secrets.SOVEREIGN_KEYSTORE_PASSWORD || 'sovereign2026' }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SovereignCRM-Release-v1.0.0-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: 📊 Release Summary
        if: always()
        run: |
          echo "═══════════════════════════════════════════════════════"
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "✅ SUCCESS: Signed Release APK built!"
            ls -lh android/app/build/outputs/apk/release/app-release.apk
          else
            echo "❌ FAILED: Release APK not found"
            find android/app/build -type f 2>/dev/null || true
          fi
          echo "═══════════════════════════════════════════════════════"