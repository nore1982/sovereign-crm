name: 🤖 Sovereign CRM — Ultimate Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: true

    - name: 🛠️ Create local.properties and Build APK
      run: |
        # التأكد من إنشاء ملف local.properties في مجلد android
        echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
        echo "=== local.properties created successfully ==="
        
        # إعطاء صلاحيات التشغيل لملف gradlew باستخدام مساره المباشر
        chmod +x android/gradlew
        
        # بناء ملف الـ APK مباشرة من المسار الرئيسي مع تحديد مجلد العمل
        cd android
        ./gradlew assembleDebug --no-daemon

    - name: 📤 Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SovereignCRM-Debug-APK
        path: '**/build/outputs/apk/debug/*.apk'
        retention-days: 7