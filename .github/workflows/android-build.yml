name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Simple Direct Android Build
        run: |
          echo "=== Setting up minimal Android project structure ==="
          rm -rf android app build settings.gradle build.gradle gradle.properties

          mkdir -p app/src/main/java/com/sovereign/crm
          mkdir -p app/src/main/res/values

          # 1. إعداد settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SovereignCRM"
          include ':app'
          EOF

          # 2. إعداد build.gradle الرئيسي
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          EOF

          # 3. إعداد app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sovereign.crm'
              compileSdk 34

              defaultConfig {
                  applicationId "com.sovereign.crm"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # 4. ملفات المصدر الأساسية
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Sovereign CRM">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/sovereign.crm/MainActivity.kt
          package com.sovereign.crm
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          EOF
          # تصحيح مسار الملف بناءً على الحزمة
          mkdir -p app/src/main/java/com/sovereign/crm
          mv app/src/main/java/com/sovereign.crm/MainActivity.kt app/src/main/java/com/sovereign/crm/
          rm -rf app/src/main/java/com/sovereign.crm

          echo "=== Initializing Gradle and Building APK ==="
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
        continue-on-error: true