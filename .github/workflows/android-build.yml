name: 🤖 Sovereign CRM — Ultra-Robust Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: true

      - name: 🔍 Locate and Fix Android Project Structure
        run: |
          echo "Current directory structure:"
          ls -la
          
          # البحث عن ملف build.gradle الخاص بالأندرويد
          GRADLE_FILE=$(find . -name "build.gradle" -not -path "*/.*" | grep -E "app|android" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE=$(find . -name "build.gradle" -not -path "*/.*" | head -n 1)
          fi
          
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Target Android project directory: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          
          # التأكد من وجود gradlew أو إنشائه تلقائياً لمنع أي خطأ
          if [ ! -f "gradlew" ]; then
            echo "⚠️ gradlew missing, generating gradle wrapper..."
            gradle wrapper --gradle-version 8.5
          fi
          
          chmod +x gradlew
          
          echo "🚀 Starting APK Build..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SovereignCRM-Android-APK
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 7