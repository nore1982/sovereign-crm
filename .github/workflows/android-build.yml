name: 🤖 Sovereign CRM — Ultimate Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: true

    - name: 🛠️ Fix local.properties and Build APK
      run: |
        # إنشاء ملف local.properties في مجلد android لمنع خطأ الفشل
        echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
        echo "Created local.properties successfully."
        
        # الانتقال لمجلد android وبناء ملف الـ APK
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: 📤 Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SovereignCRM-Debug-APK
        path: '**/build/outputs/apk/debug/*.apk'
        retention-days: 7