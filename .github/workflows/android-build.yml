name: 🤖 Sovereign CRM — Ultimate Flutter Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🐦 Set up Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x' # أو اتركها للإصدار الافتراضي المستقر
        channel: 'stable'
        cache: true

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: true

    - name: 🛠️ Configure local.properties and Build APK
      run: |
        echo "=== 1. Writing local.properties paths ==="
        cd android
        
        # كتابة مسار الأندرويد ومسار فلاتر معاً لمنع أي خطأ نهائياً
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        echo "flutter.sdk=$FLUTTER_ROOT" >> local.properties
        
        cat local.properties
        
        # التأكد من صلاحيات gradlew والتشغيل
        chmod +x gradlew
        
        echo "=== 2. Starting Flutter Build APK ==="
        cd ..
        flutter build apk --debug --no-pub

    - name: 📤 Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SovereignCRM-Debug-APK
        path: '**/build/outputs/apk/debug/*.apk'
        retention-days: 7