name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ultimate Fix and Build
        run: |
          echo "=== 1. Locating project directory ==="
          SETTINGS_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | grep -v "\.git" | head -n 1)
          
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            cd "$PROJECT_DIR"
          else
            echo "Creating a fallback basic android structure..."
            mkdir -p app/src/main
            cd app
          fi

          echo "=== 2. Injecting missing repositories and plugins setup ==="
          # إضافة إعدادات المستودعات المفقودة لكي يتعرف Gradle على الإضافات فوراً
          if [ -f "settings.gradle" ]; then
            if ! grep -q "google()" settings.gradle; then
              echo -e "\npluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\n" | cat - settings.gradle > temp && mv temp settings.gradle
            fi
          else
            cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = "SovereignCRM"
          include ':app'
          EOF
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "app/build.gradle" ]; then
            mkdir -p app
            cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              compileSdk 34
              defaultConfig {
                  applicationId "com.sovereign.crm"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF
          fi

          echo "=== 3. Running Gradle Build ==="
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug || ./gradlew build --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
        continue-on-error: true