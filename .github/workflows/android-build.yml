name: 🤖 Sovereign CRM — Auto-Find & Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔍 Find and Build APK
        run: |
          # البحث عن مكان ملف gradlew في المشروع والانتقال إلى مجلده تلقائياً
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/.*" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project directory at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SovereignCRM-APK
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 7