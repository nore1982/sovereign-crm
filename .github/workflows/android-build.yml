name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Android Project and Build
        run: |
          # البحث عن المجلد الذي يحتوي على تطبيق أندرويد حقيقي (يحتوي على plugin تطبيق أندرويد)
          ANDROID_DIR=$(grep -rl "com.android.application" . --exclude-dir=.git --exclude-dir=.github | head -n 1 | xargs dirname)
          
          if [ -n "$ANDROID_DIR" ] && [ "$ANDROID_DIR" != "." ]; then
            echo "Found Android module in: $ANDROID_DIR"
            cd "$ANDROID_DIR"
          else
            echo "Checking if root is the android project..."
          fi

          # التأكد من وجود gradlew أو توليده
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
        continue-on-error: true