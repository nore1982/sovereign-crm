name: 🤖 Sovereign CRM — Ultra-Robust Auto Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: true

    - name: 🛠️ Smart Auto-Wrapper and Build
      run: |
        echo "=== Listing Repository Files ==="
        find . -maxdepth 3 -not -path '*/.*'
        
        # البحث الذكي عن مسار البناء أو إنشاء wrapper جديد تلقائياً
        if [ -f "gradlew" ]; then
          echo "Found gradlew in root"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        elif [ -f "android/gradlew" ]; then
          echo "Found gradlew in android/"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        else
          echo "⚠️ No gradlew found. Initializing Gradle Wrapper..."
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        fi

    - name: 📤 Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SovereignCRM-APK-Debug
        path: '**/build/outputs/apk/debug/*.apk'
        retention-days: 7