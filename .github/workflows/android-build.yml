name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK using Android SDK Build-Tools
        run: |
          cd android
          # استخدام أداة البناء الافتراضية المضمنة في بيئة الأندرويد الرسمية
          ./gradlew assembleDebug || gradle assembleDebug --warning-mode all
