name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for build script
        run: chmod +x scripts/build-sovereign-android.sh

      - name: Run Android Build Script
        run: ./scripts/build-sovereign-android.sh debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sovereign-CRM-APK
          path: builds/*.apk