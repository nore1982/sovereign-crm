name: 🤖 Sovereign CRM — Ultimate Self-Healing Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: true

    - name: 🛠️ Auto-Generate Gradle Environment and Build APK
      run: |
        echo "=== 1. Checking Repository Structure ==="
        ls -la
        
        # البحث الذكي عن مسار الأندرويد أو إنشاء البيئة فوراً
        if [ -f "gradlew" ]; then
          echo "Found gradlew in root."
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        elif [ -f "android/gradlew" ]; then
          echo "Found gradlew inside android directory."
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        else
          echo "⚠️ Gradle wrapper missing. Generating fresh wrapper dynamically..."
          # إذا وجدنا مجلد android ندخله، وإلا سننشئ الإعدادات في الجذر
          if [ -d "android" ]; then
            cd android
          fi
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        fi

    - name: 📤 Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SovereignCRM-Debug-APK
        path: '**/build/outputs/apk/debug/*.apk'
        retention-days: 7