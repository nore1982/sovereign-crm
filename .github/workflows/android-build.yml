name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix and Generate Gradle Environment
        run: |
          # الانتقال إلى المجلد الذي يحتوي على مجلد android أو app
          if [ -d "android" ]; then
            cd android
          elif [ -d "android/app" ]; then
            cd android
          else
            # إنشاء هيكل مجلد أندرويد قياسي إذا كان المجلد مفقوداً
            mkdir -p android/app
            cp -r * android/app/ 2>/dev/null || true
            cd android
          fi

          # إذا لم يكن هناك settings.gradle، نقوم بإنشائه لكي يقبل البناء
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "include ':app'" > settings.gradle
          fi

          # توليد أدوات Gradle Wrapper الناقصة بشكل تلقائي
          gradle wrapper --gradle-version 8.5
          
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            ./gradlew assembleDebug
          else
            cd android/app
            ../gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sovereign-CRM-APK
          path: '**/build/outputs/apk/debug/*.apk'
