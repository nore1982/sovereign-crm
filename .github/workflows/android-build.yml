        run: chmod +x android/gradlew

      # ─────────── Setup Keystore ───────────
      - name: 🔐 Decode Keystore from Secrets
        run: |
          if [ -n "${{ secrets.SOVEREIGN_KEYSTORE_BASE64 }}" ]; then
