name: 🏛️ Sovereign CRM — Android Build (Production-Ready)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.0.2'
  AGP_VERSION: '8.1.0'

jobs:
  build-debug:
    name: 🧪 Build Debug APK
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event.inputs.build_type == 'debug' || github.ref != 'refs/heads/main'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚡ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: true

      - name: 📦 Cache npm & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.gradle/caches
            ~/.gradle/wrapper
            node_modules
            android/.gradle
          key: ${{ runner.os }}-sovereign-v2-${{ hashFiles('**/package-lock.json', 'android/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-sovereign-v2-

      - name: 📦 Install Dependencies
        run: |
          npm ci
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 --save-exact
          npm install @capacitor/splash-screen @capacitor/status-bar @capacitor/keyboard --save

      - name: 🏗️ Build Production Frontend
        run: npm run build:prod
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://sovereign-crm-api.up.railway.app' }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL || 'https://sovereign-crm-api.up.railway.app' }}

      - name: 📱 Generate Android Project via Capacitor
        run: |
          echo "🔄 Checking Android project..."
          if [ ! -d "android" ]; then
            echo "⚠️  Android folder missing. Generating via Capacitor..."
            npx cap add android
          fi
          echo "🔄 Syncing Capacitor Android..."
          npx cap sync android
          
          if [ ! -f "android/build.gradle" ]; then
            echo "❌ CRITICAL: Root build.gradle not generated by Capacitor!"
            exit 1
          fi
          if [ ! -f "android/settings.gradle" ]; then
            echo "❌ CRITICAL: settings.gradle not generated by Capacitor!"
            exit 1
          fi
          if [ ! -f "android/gradlew" ]; then
            echo "❌ CRITICAL: Gradle wrapper not generated!"
            exit 1
          fi
          echo "✅ Android project structure generated by Capacitor successfully!"

      - name: ⚙️ Fix Gradle Wrapper Version
        run: |
          echo "🔧 Ensuring Gradle Wrapper compatibility..."
          WRAPPER_PROPS="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_PROPS" ]; then
            sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.0.2-bin.zip|g' "$WRAPPER_PROPS"
            sed -i 's|gradle-[0-9.]*-all.zip|gradle-8.0.2-bin.zip|g' "$WRAPPER_PROPS"
            echo "✅ Gradle wrapper fixed to 8.0.2"
          else
            mkdir -p android/gradle/wrapper
            cat > "$WRAPPER_PROPS" << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          fi

      - name: ⚙️ Fix Android Gradle Plugin Version
        run: |
          ROOT_BUILD_GRADLE="android/build.gradle"
          if [ -f "$ROOT_BUILD_GRADLE" ]; then
            sed -i 's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.1.0/g' "$ROOT_BUILD_GRADLE"
            echo "✅ AGP fixed to 8.1.0"
          fi

      - name: ⚙️ Configure app/build.gradle for API 33
        run: |
          APP_BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$APP_BUILD_GRADLE" ]; then
            sed -i 's/compileSdk [0-9]*/compileSdk 33/g' "$APP_BUILD_GRADLE" 2>/dev/null || true
            sed -i 's/targetSdk [0-9]*/targetSdk 33/g' "$APP_BUILD_GRADLE" 2>/dev/null || true
            echo "✅ app/build.gradle configured for API 33"
          else
            echo "❌ app/build.gradle not found!"
            exit 1
          fi

      - name: 🔧 Fix gradlew Permissions
        run: |
          chmod +x android/gradlew

      - name: 🔨 Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SovereignCRM-Debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  build-release:
    name: 🔐 Build Signed Release APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event.inputs.build_type == 'release'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: true

      - name: 📦 Install Dependencies
        run: |
          npm ci
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 --save-exact
          npm install @capacitor/splash-screen @capacitor/status-bar @capacitor/keyboard --save

      - name: 🏗️ Build Production Frontend
        run: npm run build:prod
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://sovereign-crm-api.up.railway.app' }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL || 'https://sovereign-crm-api.up.railway.app' }}

      - name: 📱 Generate Android Project via Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: ⚙️ Fix Gradle Wrapper & AGP
        run: |
          WRAPPER_PROPS="android/gradle/wrapper/gradle-wrapper.properties"
          mkdir -p android/gradle/wrapper
          cat > "$WRAPPER_PROPS" << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          sed -i 's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.1.0/g' android/build.gradle
          sed -i 's/compileSdk [0-9]*/compileSdk 33/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdk [0-9]*/targetSdk 33/g' android/app/build.gradle 2>/dev/null || true

      - name: 🔧 Fix Permissions
        run: chmod +x android/gradlew

      - name: 🔐 Setup Keystore
        run: |
          if [ -n "${{ secrets.SOVEREIGN_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SOVEREIGN_KEYSTORE_BASE64 }}" | base64 -d > sovereign-crm.keystore
          else
            keytool -genkey -v -keystore sovereign-crm.keystore -alias sovereign -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Sovereign,OU=Dev,O=Sovereign,L=Riyadh,C=SA" -storepass "sovereign2026" -keypass "sovereign2026"
          fi

      - name: 🔨 Build Signed Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          SOVEREIGN_KEYSTORE_PASSWORD: ${{ secrets.SOVEREIGN_KEYSTORE_PASSWORD || 'sovereign2026' }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SovereignCRM-Release-v1.0.0-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30