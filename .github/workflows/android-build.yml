name: 🤖 Sovereign CRM — Final Smart Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: true

    - name: 🛠️ Generate Gradle Wrapper and Build APK
      run: |
        echo "=== 1. Checking Android Directory ==="
        cd android
        
        # إنشاء ملف local.properties لمنع خطأ غيابه
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        
        # التأكد من وجود gradlew أو توليده سحابياً فوراً إذا كان مفقوداً
        if [ ! -f "gradlew" ]; then
          echo "⚠️ gradlew is missing! Generating fresh Gradle wrapper..."
          gradle wrapper --gradle-version 8.5
        else
          echo "✅ gradlew found."
        fi
        
        # إعطاء صلاحيات التشغيل
        chmod +x gradlew
        
        echo "=== 2. Starting Gradle Build ==="
        ./gradlew assembleDebug --no-daemon

    - name: 📤 Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SovereignCRM-Debug-APK
        path: '**/build/outputs/apk/debug/*.apk'
        retention-days: 7