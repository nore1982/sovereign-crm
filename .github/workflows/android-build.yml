name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle Wrapper and Build
        run: |
          # البحث عن مكان ملف build.gradle لمعرفة المجلد الصحيح
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            gradle wrapper
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "android/build.gradle" ] || [ -f "android/build.gradle.kts" ]; then
            cd android
            gradle wrapper
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Searching for build.gradle anywhere..."
            BUILD_DIR=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
            if [ -n "$BUILD_DIR" ]; then
              cd "$BUILD_DIR"
              gradle wrapper
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              echo "Error: No build.gradle found!"
              exit 1
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
        continue-on-error: true