name: 🏛️ Sovereign CRM — Android Build (Robust Discovery)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '17'
  # ─── اتركه فارغاً للاكتشاف التلقائي، أو اكتب اسم المجلد (مثال: frontend) ───
  MANUAL_PROJECT_DIR: ''

jobs:
  build-debug:
    name: 🧪 Build Debug APK
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event.inputs.build_type == 'debug' || github.ref != 'refs/heads/main'

    steps:
      # ─────────── Checkout ───────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────── 🔍 اكتشاف آمن لمجلد المشروع ───────────
      - name: 🔍 Discover Project Directory (Fail-Safe)
        id: discover
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "🔍 Starting project discovery..."

          # ─── الخيار 1: مسار يدوي (إذا حددته في env) ───
          if [ -n "${{ env.MANUAL_PROJECT_DIR }}" ]; then
            echo "📌 Using MANUAL_PROJECT_DIR: ${{ env.MANUAL_PROJECT_DIR }}"
            PROJECT_DIR="${{ env.MANUAL_PROJECT_DIR }}"
            
            if [ ! -f "$PROJECT_DIR/package.json" ]; then
              echo "❌ Manual directory specified but package.json NOT FOUND in: $PROJECT_DIR"
              exit 1
            fi
            
            echo "✅ Manual path verified: $PROJECT_DIR"
            echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
            echo "═══════════════════════════════════════════════════════"
            exit 0
          fi

          # ─── الخيار 2: اكتشاف تلقائي آمن ───
          echo "🔎 Searching for package.json (max depth: 3)..."
          
          # البحث مع حفظ النتيجة في متغير
          FOUND_FILE=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" -print -quit)
          
          echo "📄 Found: $FOUND_FILE"
          
          if [ -n "$FOUND_FILE" ] && [ -f "$FOUND_FILE" ]; then
            # استخراج المجلد بأمان (بدون xargs)
            PROJECT_DIR=$(dirname "$FOUND_FILE")
            # إزالة ./ من البداية إن وُجد
            PROJECT_DIR="${PROJECT_DIR#./}"
            
            echo "✅ Auto-discovered project directory: $PROJECT_DIR"
            echo "📁 Full path: $(pwd)/$PROJECT_DIR"
          else
            echo "⚠️  No package.json found via search. Defaulting to ROOT (.)"
            PROJECT_DIR="."
            echo "✅ Defaulting to root directory"
          fi

          # ─── التحقق النهائي ───
          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "❌ FATAL: package.json still not found in: $PROJECT_DIR"
            echo "📁 Listing repository root:"
            ls -la
            echo ""
            echo "📁 Listing all subdirectories (level 1):"
            find . -maxdepth 1 -type d
            exit 1
          fi

          echo "✅ package.json verified at: $PROJECT_DIR/package.json"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "═══════════════════════════════════════════════════════"

      # ─────────── Debug: عرض المجلد المختار ───────────
      - name: 🐞 Debug Selected Directory
        run: |
          PROJECT_DIR="${{ steps.discover.outputs.project_dir }}"
          echo "📌 Selected project directory: $PROJECT_DIR"
          echo "📁 Contents:"
          ls -la "$PROJECT_DIR"
          echo ""
          echo "📄 package.json exists: $(test -f $PROJECT_DIR/package.json && echo 'YES' || echo 'NO')"

      # ─────────── Setup Node.js (بدون cache lock) ───────────
      - name: ⚡ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ─────────── Install npm Dependencies (آمن) ───────────
      - name: 📦 Install npm Dependencies
        working-directory: ${{ steps.discover.outputs.project_dir }}
        run: |
          echo "🔧 Installing in: $(pwd)"
          
          if [ ! -f "package.json" ]; then
            echo "❌ package.json missing in $(pwd)"
            exit 1
          fi
          
          npm install --no-audit --no-fund --prefer-offline || {
            echo "⚠️  Retrying with --legacy-peer-deps..."
            npm install --legacy-peer-deps --no-audit --no-fund || {
              echo "⚠️  Retrying with --force..."
              npm install --force --no-audit --no-fund
            }
          }
          
          echo "✅ npm install done"

      # ─────────── Install Capacitor ───────────
      - name: 📦 Install Capacitor & Plugins
        working-directory: ${{ steps.discover.outputs.project_dir }}
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 --save-exact --no-audit --no-fund || {
            npm install @capacitor/core @capacitor/cli @capacitor/android --save --no-audit --no-fund
          }
          npm install @capacitor/splash-screen @capacitor/status-bar @capacitor/keyboard --save --no-audit --no-fund

      # ─────────── Setup JDK 17 ───────────
      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # ─────────── Setup Android SDK ───────────
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: true

      # ─────────── Build Frontend ───────────
      - name: 🏗️ Build Production Frontend
        working-directory: ${{ steps.discover.outputs.project_dir }}
        run: |
          npm run build:prod || npx vite build --mode production
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://sovereign-crm-api.up.railway.app' }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL || 'https://sovereign-crm-api.up.railway.app' }}

      # ─────────── Generate Android via Capacitor ───────────
      - name: 📱 Generate Android Project
        working-directory: ${{ steps.discover.outputs.project_dir }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          
          [ -f "android/build.gradle" ] || (echo "❌ Missing root build.gradle" && exit 1)
          [ -f "android/settings.gradle" ] || (echo "❌ Missing settings.gradle" && exit 1)
          [ -f "android/gradlew" ] || (echo "❌ Missing gradlew" && exit 1)
          echo "✅ Android project verified"

      # ─────────── Fix Gradle & AGP ───────────
      - name: ⚙️ Fix Gradle & AGP Versions
        working-directory: ${{ steps.discover.outputs.project_dir }}
        run: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          sed -i 's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.1.0/g' android/build.gradle
          sed -i 's/compileSdk [0-9]*/compileSdk 33/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdk [0-9]*/targetSdk 33/g' android/app/build.gradle 2>/dev/null || true

      # ─────────── Fix Permissions ───────────
      - name: 🔧 Fix gradlew Permissions
        working-directory: ${{ steps.discover.outputs.project_dir }}
        run: chmod +x android/gradlew

      # ─────────── Build Debug APK ───────────
      - name: 🔨 Build Debug APK
        working-directory: ${{ steps.discover.outputs.project_dir }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ─────────── Upload Artifact ───────────
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SovereignCRM-Debug-${{ github.run_number }}
          path: ${{ steps.discover.outputs.project_dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # ─────────── Final Summary ───────────
      - name: 📊 Final Summary
        if: always()
        run: |
          PROJECT_DIR="${{ steps.discover.outputs.project_dir }}"
          echo "═══════════════════════════════════════════════════════"
          echo "📌 Project directory used: $PROJECT_DIR"
          if [ -f "$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ SUCCESS: Debug APK built!"
            ls -lh "$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          else
            echo "❌ FAILED: APK not found"
            find "$PROJECT_DIR/android/app/build" -type f 2>/dev/null || true
          fi
          echo "═══════════════════════════════════════════════════════"

  # ═══════════════════════════════════════════════════════════════
  # 🔐 Job 2: بناء Release APK موقّع
  # ═══════════════════════════════════════════════════════════════
  build-release:
    name: 🔐 Build Signed Release APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event.inputs.build_type == 'release'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Discover Project Directory (Fail-Safe)
        id: discover
        run: |
          if [ -n "${{ env.MANUAL_PROJECT_DIR }}" ]; then
            echo "project_dir=${{ env.MANUAL_PROJECT_DIR }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          FOUND_FILE=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" -print -quit)
          
          if [ -n "$FOUND_FILE" ] && [ -f "$FOUND_FILE" ]; then
            PROJECT_DIR=$(dirname "$FOUND_FILE")
            PROJECT_DIR="${PROJECT_DIR#./}"
          else
            PROJECT_DIR="."
          fi
          
          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "❌ package.json not found"
            exit 1
          fi
          
          echo "✅ Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: ⚡ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Dependencies
        working-directory: ${{ steps.discover.outputs.project_dir }}
        run: |
          npm install --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 --save-exact --no-audit --no-fund
          npm install @capacitor/splash-screen @capacitor/status-bar @capacitor/keyboard --save --no-audit --no-fund

      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: true

      - name: 🏗️ Build Frontend
        working-directory: ${{ steps.discover.outputs.project_dir }}
        run: npm run build:prod || npx vite build --mode production
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://sovereign-crm-api.up.railway.app' }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL || 'https://sovereign-crm-api.up.railway.app' }}

      - name: 📱 Generate Android Project
        working-directory: ${{ steps.discover.outputs.project_dir }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          [ -f "android/build.gradle" ] || (echo "❌ Missing root build.gradle" && exit 1)
          [ -f "android/settings.gradle" ] || (echo "❌ Missing settings.gradle" && exit 1)
          [ -f "android/gradlew" ] || (echo "❌ Missing gradlew" && exit 1)

      - name: ⚙️ Fix Gradle & AGP
        working-directory: ${{ steps.discover.outputs.project_dir }}
        run: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          sed -i 's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.1.0/g' android/build.gradle
          sed -i 's/compileSdk [0-9]*/compileSdk 33/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdk [0-9]*/targetSdk 33/g' android/app/build.gradle 2>/dev/null || true

      - name: 🔧 Fix Permissions
        working-directory: ${{ steps.discover.outputs.project_dir }}
        run: chmod +x android/gradlew

      - name: 🔐 Setup Keystore
        working-directory: ${{ steps.discover.outputs.project_dir }}
        run: |
          if [ -n "${{ secrets.SOVEREIGN_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SOVEREIGN_KEYSTORE_BASE64 }}" | base64 -d > sovereign-crm.keystore
          else
            keytool -genkey -v -keystore sovereign-crm.keystore -alias sovereign -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Sovereign,OU=Dev,O=Sovereign,L=Riyadh,C=SA" -storepass "sovereign2026" -keypass "sovereign2026"
          fi

      - name: 🔨 Build Signed Release APK
        working-directory: ${{ steps.discover.outputs.project_dir }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          SOVEREIGN_KEYSTORE_PASSWORD: ${{ secrets.SOVEREIGN_KEYSTORE_PASSWORD || 'sovereign2026' }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SovereignCRM-Release-v1.0.0-${{ github.run_number }}
          path: ${{ steps.discover.outputs.project_dir }}/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: 📊 Release Summary
        if: always()
        run: |
          PROJECT_DIR="${{ steps.discover.outputs.project_dir }}"
          if [ -f "$PROJECT_DIR/android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "✅ SUCCESS: Release APK built!"
            ls -lh "$PROJECT_DIR/android/app/build/outputs/apk/release/app-release.apk"
          else
            echo "❌ FAILED"
            find "$PROJECT_DIR/android/app/build" -type f 2>/dev/null || true
          fi