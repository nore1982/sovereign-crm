name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ultimate Stable Android Build
        run: |
          echo "=== Cleaning workspace ==="
          rm -rf android app build settings.gradle build.gradle gradle.properties

          mkdir -p app/src/main/java/com/sovereign/crm
          mkdir -p app/src/main/res/values

          # 1. ملف settings.gradle البسيط والنظيف
          cat << 'EOF' > settings.gradle
          rootProject.name = "SovereignCRM"
          include ':app'
          EOF

          # 2. ملف build.gradle الرئيسي (مع تعريف كافة المستودعات المطلوبة للأندرويد)
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 3. ملف build.gradle الخاص بالتطبيق (بالصيغة الكلاسيكية المضمونة)
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.sovereign.crm'
              compileSdk 34

              defaultConfig {
                  applicationId "com.sovereign.crm"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # 4. ملف Manifest والنشاط الرئيسي
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Sovereign CRM"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/sovereign/crm/MainActivity.kt
          package com.sovereign.crm
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          EOF

          echo "=== Running Gradle Wrapper & Build ==="
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
        continue-on-error: true